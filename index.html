<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QTRUST V3 - Quantum Wallet</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
body{font-family:Inter,system-ui;background:#0a0a0f;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#15151f;border:1px solid #2a2a3a;border-radius:20px;padding:32px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h2{margin:0 0 8px;text-align:center;background:linear-gradient(90deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:26px}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:24px}
input{width:100%;padding:14px;background:#0f0f17;border:1px solid #2a2a3a;border-radius:12px;color:#fff;margin-bottom:12px;outline:none;box-sizing:border-box}
input:focus{border-color:#8b5cf6}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:600;cursor:pointer;margin-bottom:10px}
.primary{background:linear-gradient(90deg,#8b5cf6,#3b82f6);color:#fff}
.secondary{background:#232334;color:#aaa}
.mnemonic{background:#0f0f17;border:1px dashed #3a3a4a;padding:12px;border-radius:12px;font-size:13px;line-height:1.8;margin:12px 0;word-spacing:6px}
.addr{font-size:12px;color:#8b5cf6;background:#1a1a2e;padding:10px;border-radius:10px;word-break:break-all;text-align:center}
.hidden{display:none}
#status{font-size:12px;text-align:center;color:#f87171;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <!-- LOGIN -->
  <div id="loginView">
    <h2>QTRUST V3</h2>
    <div class="sub">Quantum Secure Wallet • Chain 20949</div>
    <input type="password" id="pass" placeholder="Password (min 8 chars)">
    <input type="password" id="cpass" placeholder="Confirm Password">
    <div id="status"></div>
    <button class="primary" id="createBtn">Create / Unlock Wallet</button>
    <button class="secondary" id="importBtn">Import Wallet</button>
    <div id="importBox" class="hidden">
      <input type="text" id="mnemonicInput" placeholder="Enter 12 words seed phrase">
      <button class="primary" id="doImportBtn">Import Now</button>
    </div>
  </div>

  <!-- WALLET -->
  <div id="walletView" class="hidden">
    <h2>Wallet Unlocked</h2>
    <div class="sub">Quantum Chain • ID 20949</div>
    <div class="addr" id="addr"></div>
    <div class="mnemonic hidden" id="mnemoBox"></div>
    <button class="secondary" id="showSeedBtn">Show Seed Phrase</button>
    <button class="primary" id="connectChainBtn">Connect to Chain 20949</button>
    <button class="secondary" id="lockBtn">Lock Wallet</button>
    <button class="secondary" id="logoutBtn" style="color:#f87171">Logout & Clear</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');

function showView(walletData, showSeed=false){
  $('loginView').classList.add('hidden');
  $('walletView').classList.remove('hidden');
  $('addr').innerText = walletData.address;
  if(showSeed){
    $('mnemoBox').innerText = walletData.mnemonic;
    $('mnemoBox').classList.remove('hidden');
  }
}

$('createBtn').onclick = async ()=>{
  const p = $('pass').value, cp = $('cpass').value;
  if(p.length < 8) return statusEl.innerText = "Password min 8 chars";
  const stored = localStorage.getItem('qtrust_enc');
  if(stored){
    try{
      const dec = CryptoJS.AES.decrypt(stored, p).toString(CryptoJS.enc.Utf8);
      if(!dec) throw Error();
      const data = JSON.parse(dec);
      showView(data);
      localStorage.setItem('qtrust_unlocked','1');
      statusEl.innerText="";
    }catch{ statusEl.innerText="Wrong Password!"; }
  } else {
    if(p!==cp) return statusEl.innerText="Passwords not match";
    const w = ethers.Wallet.createRandom();
    const data = {address:w.address, mnemonic:w.mnemonic.phrase, privateKey:w.privateKey};
    const enc = CryptoJS.AES.encrypt(JSON.stringify(data), p).toString();
    localStorage.setItem('qtrust_enc', enc);
    localStorage.setItem('qtrust_unlocked','1');
    showView(data,true);
  }
};

$('importBtn').onclick = ()=> $('importBox').classList.toggle('hidden');

$('doImportBtn').onclick = async ()=>{
  const phrase = $('mnemonicInput').value.trim();
  const p = $('pass').value;
  if(p.length<8) return statusEl.innerText="Set password first";
  if(phrase.split(' ').length < 12) return statusEl.innerText="Enter 12 words";
  try{
    const w = ethers.Wallet.fromPhrase(phrase);
    const data = {address:w.address, mnemonic:phrase, privateKey:w.privateKey};
    const enc = CryptoJS.AES.encrypt(JSON.stringify(data), p).toString();
    localStorage.setItem('qtrust_enc', enc);
    localStorage.setItem('qtrust_unlocked','1');
    showView(data,false);
  }catch(e){ statusEl.innerText="Invalid seed phrase"; }
};

$('showSeedBtn').onclick = ()=>{
  $('mnemoBox').classList.toggle('hidden');
};

$('connectChainBtn').onclick = async ()=>{
  const CHAIN_ID_HEX = '0x51DD';
  try{
    if(window.ethereum){
      await window.ethereum.request({method:'wallet_addEthereumChain', params:[{chainId:CHAIN_ID_HEX, chainName:'QTRUST Quantum Chain', rpcUrls:['https://rpc.qtrustchain.com'], nativeCurrency:{name:'QTRUST', symbol:'QTRUST', decimals:18}, blockExplorerUrls:['https://explorer.qtrustchain.com']}]});
      alert('Chain 20949 Connected!');
    } else {
      alert('QTRUST Chain ID: 20949 (0x51DD) - Add to Metamask manually');
    }
  }catch(e){ alert(e.message); }
};

$('lockBtn').onclick = ()=>{
  $('walletView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  $('pass').value=''; $('cpass').value='';
  localStorage.removeItem('qtrust_unlocked');
};

$('logoutBtn').onclick = ()=>{
  if(confirm('Delete wallet from this device?')){
    localStorage.clear();
    location.reload();
  }
};
</script>
</body>
</html>
