<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QTRUST - Create Token - Algorand</title>
<script src="https://cdn.jsdelivr.net/npm/algosdk@2.7.0/dist/browser/algosdk.min.js"></script>
<style>body{font-family:sans-serif;background:#0a0a0a;color:#fff;padding:20px;text-align:center}input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none}button{background:#00d4ff;font-weight:bold;font-size:16px}.box{background:#1a1a1a;padding:20px;border-radius:15px}</style>
</head><body>
<h2>🔥 QTRUST Token Creator</h2>
<p>Algorand Testnet - 5 Crore - Bina Code</p>
<div class="box">
<input id="mn" placeholder="Apne 25 words yahan paste karo">
<button onclick="create()">CREATE 5 CRORE QTRUST TOKEN</button>
<p id="out"></p>
</div>
<script>
async function create(){
  const out=document.getElementById('out');
  try{
    out.innerText="Ban raha hai... ruk ja";
    const mn=document.getElementById('mn').value.trim();
    const acc=algosdk.mnemonicToSecretKey(mn);
    const client=new algosdk.Algodv2("", "https://testnet-api.algonode.cloud", "");
    const params=await client.getTransactionParams().do();
    const txn=algosdk.makeAssetCreateTxnWithSuggestedParamsFromObject({
      sender:acc.addr, total:50000000, decimals:0, defaultFrozen:false,
      unitName:"QTRUST", assetName:"QTrustChain Coin",
      manager:acc.addr, reserve:acc.addr, freeze:acc.addr, clawback:acc.addr,
      assetURL:"https://samdeep11.github.io/qtrust/", suggestedParams:params
    });
    const signed=txn.signTxn(acc.sk);
    const {txId}=await client.sendRawTransaction(signed).do();
    const res=await algosdk.waitForConfirmation(client, txId, 4);
    out.innerHTML="HO GAYA! ✅<br>Asset ID: "+res.assetIndex+"<br><a style='color:#00d4ff' href='https://lora.algokit.io/testnet/asset/"+res.assetIndex+"'>Explorer me Dekho</a><br>Is Asset ID ko copy karke mujhe bhej de";
  }catch(e){ out.innerText="Error: "+e.message; }
}
</script></body></html>
